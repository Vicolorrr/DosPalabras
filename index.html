'use strict';const KEY='dospalabras-v2-progress';const TODAY=()=>new Date().toLocaleDateString('en-CA');const now=()=>Date.now();const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const shuffle=a=>[...a].sort(()=>Math.random()-.5);let words=[],state={cards:{},settings:{daily:5},date:null},session=null,quiz=null,shownPage='home';
function save(){localStorage.setItem(KEY,JSON.stringify(state));scheduleCloudSave()}function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&typeof x==='object'&&x.cards)state=x}catch(e){}}function card(w){return state.cards[w.id]||{status:'new',due:0,step:0,interval:0,ease:2.5,reps:0,lapses:0,correct:0,wrong:0,last:0}}function up(w,c){state.cards[w.id]=c;save()}function isDue(w){let c=card(w);return c.status!=='new'&&c.due<=now()}function countNewToday(lang){return words.filter(w=>w.lang===lang&&card(w).introduced===TODAY()).length}function remaining(lang){return Math.max(0,(+state.settings.daily||5)-countNewToday(lang))}function dayOffset(days=0){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+days);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function hashText(s){let h=2166136261;for(const c of s){h=Math.imul(h^c.charCodeAt(0),16777619)}return h>>>0}
function stableMix(a,seed){return [...a].sort((x,y)=>hashText(seed+':'+x.id)-hashText(seed+':'+y.id))}
function balancedPick(lang,amount,seed,excluded){const candidates=stableMix(words.filter(w=>w.lang===lang&&card(w).status==='new'&&!excluded.has(w.id)),seed);const buckets={};for(const w of candidates){(buckets[w.category||'other']??=[]).push(w)}const categories=Object.keys(buckets).sort((a,b)=>hashText(seed+a)-hashText(seed+b));let selected=[];while(selected.length<amount&&categories.some(c=>buckets[c].length)){for(const c of categories){if(selected.length>=amount)break;if(buckets[c].length)selected.push(buckets[c].shift())}}return stableMix(selected,seed+':order')}
function dailyIds(lang){
  state.dailySets ||= {};
  const key=dayOffset()+':'+lang;
  const limit=Math.max(1,Number(state.settings?.daily)||5);
  const previous=Array.isArray(state.dailySets[key])?state.dailySets[key]:[];
  const existing=new Set(words.filter(w=>w.lang===lang).map(w=>w.id));
  const introduced=words.filter(w=>w.lang===lang&&card(w).introduced===dayOffset()).map(w=>w.id);
  // Recover today's words from older versions, including lists saved before this update.
  const chosen=[...new Set([...introduced,...previous.filter(id=>existing.has(id))])].slice(0,limit);
  const reserved=new Set(Object.entries(state.dailySets)
    .filter(([k])=>k.endsWith(':'+lang)&&k!==key)
    .flatMap(([,ids])=>Array.isArray(ids)?ids:[]));
  for(const id of chosen)reserved.add(id);
  const added=balancedPick(lang,limit-chosen.length,key,reserved);
  const result=[...chosen,...added.map(w=>w.id)];
  if(JSON.stringify(previous)!==JSON.stringify(result)){state.dailySets[key]=result;save()}
  return result;
}
function todays(lang){return ['ja','de'].filter(l=>lang==='all'||lang===l).flatMap(l=>dailyIds(l)).map(id=>words.find(w=>w.id===id)).filter(Boolean)}
function choose(lang,free=false){if(free)return words.filter(w=>(lang==='all'||w.lang===lang)&&card(w).status!=='new');return words.filter(w=>(lang==='all'||w.lang===lang)&&isDue(w))}

function recordActivity(lang,kind){state.activity ||= {};const key=dayOffset()+':'+lang;const entry=state.activity[key] ||= {introduced:0,reviews:0,quizCorrect:0,quizWrong:0};entry[kind]=(entry[kind]||0)+1}
function introduce(w){let c={...card(w)};if(c.status==='new'){c.status='learning';c.introduced=TODAY();c.due=now();c.step=0;recordActivity(w.lang,'introduced');up(w,c)}}function rate(w,r){let c={...card(w)},t=now(),day=86400000;if(c.status==='new'){c.status='learning';c.introduced=TODAY();c.step=0;recordActivity(w.lang,'introduced')}recordActivity(w.lang,'reviews');if(r==='again'){c.wrong++;c.lapses++;c.status='learning';c.step=0;c.due=t+10*60000;c.interval=0;c.ease=Math.max(1.3,c.ease-.2)}else if(c.status==='learning'){c.correct++;if(r==='hard'){c.due=t+10*60000}else if(r==='good'){c.step++;if(c.step>=2){c.status='review';c.interval=1;c.due=t+day;c.reps++}else c.due=t+day}else{c.status='review';c.interval=3;c.due=t+3*day;c.reps++;c.ease=Math.min(3,c.ease+.1)}}else{c.correct++;c.reps++;if(r==='hard'){c.interval=Math.max(1,Math.round(c.interval*1.2));c.ease=Math.max(1.3,c.ease-.15)}if(r==='good')c.interval=Math.max(1,Math.round(c.interval*c.ease));if(r==='easy'){c.interval=Math.max(2,Math.round(c.interval*c.ease*1.3));c.ease=Math.min(3,c.ease+.1)}c.due=t+c.interval*day}c.last=t;up(w,c)}
function page(id){shownPage=id;document.querySelectorAll('main>section').forEach(x=>x.classList.toggle('hidden',x.id!==id));document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('secondary',b.dataset.page!==id));render()};$('#tabs').addEventListener('click',e=>{let b=e.target.closest('button');if(b)page(b.dataset.page)});function label(l){return l==='ja'?'🇯🇵 Japonés':'🇩🇪 Alemán'}function jp(w){return esc(w.word)+(w.lang==='ja'&&w.reading&&w.reading!==w.word?` <span class="reading">（${esc(w.reading)}）</span>`:'')}function answer(w){return `<b>${jp(w)}</b><p>${esc(w.meaning)}</p><p>${esc(w.example)}<br><small>${esc(w.exampleEs)}</small></p>${w.lang==='de'&&w.reading?`<small>Plural: ${esc(w.reading)}</small>`:''}`}
function renderHome(){let html='<h2>Tu estudio de hoy</h2><div class="grid">';for(const lang of ['ja','de']){let a=words.filter(w=>w.lang===lang);dailyIds(lang);let due=a.filter(isDue).length,n=countNewToday(lang);html+=`<div class="panel"><b>${label(lang)}</b><p><span class="stats">${due}</span> repasos pendientes</p><p>${n}/${state.settings.daily} nuevas hoy</p><div class="progress"><div style="width:${Math.min(100,100*n/state.settings.daily)}%"></div></div><p class="muted">${a.length} entradas disponibles</p><button data-action="study" data-lang="${lang}">Estudiar</button></div>`}html+='</div><div class="panel"><h2>¿Qué estudiar primero?</h2><p>Primero conoce tus cinco palabras nuevas de cada idioma. Después repásalas con tarjetas y practica con quizzes acumulativos de vocabulario ya presentado. Las listas de hoy no cambian al navegar. Las nuevas palabras se mezclan por categoría. En contexto puedes leer ejemplos de palabras estudiadas ayer y hoy.</p><div class="row"><button data-action="study" data-lang="all">Aprender palabras de hoy</button><button class="secondary" data-action="quiz">Hacer quiz</button></div></div>';$('#home').innerHTML=html}
function startLearn(lang){
 const items=todays(lang);
 if(!items.length){notice('No hay palabras disponibles. Revisa que ja.json y de.json estén cargados.');page('home');return}
 session={items,i:0,done:0,reveal:false,free:false,learningOnly:true};page('study')
}
function renderStudy(){let el=$('#study');if(!session){el.innerHTML=`<h2>Tarjetas</h2><div class="panel"><label>Idioma <select id="studyLang"><option value="all">Ambos</option><option value="ja">Japonés</option><option value="de">Alemán</option></select></label><div class="row spaced"><button data-action="start-learn">Aprender las palabras de hoy</button><button class="secondary" data-action="start-today">Tarjetas: hoy + pendientes</button><button class="secondary" data-action="start-study">Solo repasos vencidos</button><button class="secondary" data-action="start-free">Estudio libre (historial)</button></div><p class="hint">Las palabras de hoy son siempre las mismas. Aprender muestra el significado; Tarjetas oculta la respuesta y añade repasos vencidos. Estudio libre solo usa palabras ya presentadas y no cambia el calendario.</p></div>`;return}let w=session.items[session.i];if(!w){el.innerHTML=`<div class="panel center"><h2>¡Sesión terminada! 🎉</h2><p>Has revisado ${session.done} tarjetas.</p><button data-action="end-study">Volver</button></div>`;return}let fresh=!!session.learningOnly;let title=fresh?'Palabras nuevas de hoy':session.free?'Estudio libre':'Tarjetas de repaso';el.innerHTML=`<div class="row between"><h2>${title}</h2><span class="pill">${session.i+1}/${session.items.length}</span></div><div class="panel center"><small>${label(w.lang)} · ${esc(w.category)}</small><div class="word">${jp(w)}</div>${fresh?`<p class="pill">Palabra nueva · primero aprende su significado</p>${answer(w)}<button data-action="learn-word">${card(w).status==='new'?'Ya la estudié · Siguiente':'Siguiente palabra'}</button>`:session.reveal?`<hr>${answer(w)}<div class="row" style="justify-content:center">${session.free?'<button data-action="next-card">Siguiente</button>':`<button class="danger" data-rate="again">Otra vez</button><button class="secondary" data-rate="hard">Difícil</button><button data-rate="good">Bien</button><button class="secondary" data-rate="easy">Fácil</button>`}</div>`:`<p class="muted">Intenta recordar su significado antes de revelar la respuesta.</p><button data-action="reveal">Mostrar respuesta</button>`}</div><button class="secondary" data-action="end-study">Salir de la sesión</button>`}
function nextCard(){session.i++;session.done++;session.reveal=false;renderStudy()}function startStudy(lang,free){let items=choose(lang,free);session={items:free?items.slice(0,25):items,i:0,done:0,reveal:false,free,introduced:new Set()};page('study')}
function optionsFor(w){let distractors=shuffle(words.filter(x=>x.lang===w.lang&&x.id!==w.id&&x.meaning!==w.meaning)).slice(0,3);return shuffle([w,...distractors])}function startQuiz(){let lang=$('#quizLang')?.value||'all',mode=$('#quizMode')?.value||'mixed',scope=$('#quizScope')?.value||'mixed';let learned=words.filter(w=>(lang==='all'||w.lang===lang)&&card(w).status!=='new');let today=learned.filter(w=>card(w).introduced===TODAY());let older=learned.filter(w=>card(w).introduced!==TODAY());let difficult=a=>shuffle(a).sort((a,b)=>((card(b).wrong||0)+(card(b).quizWrong||0)*2)-((card(a).wrong||0)+(card(a).quizWrong||0)*2));let pool=scope==='today'?today:scope==='difficult'?difficult(learned):scope==='all'?shuffle(learned):[...shuffle(today),...difficult(older)];if(!pool.length){notice('Primero aprende las palabras en la sección Aprender.');return}let items=pool.slice(0,scope==='all'?Math.min(20,pool.length):Math.min(10,pool.length));quiz={items,i:0,score:0,mode,checked:false,response:'',options:null};page('quiz')}
function logQuiz(w,correct){let c={...card(w)};c.quizCorrect=(c.quizCorrect||0)+Number(correct);c.quizWrong=(c.quizWrong||0)+Number(!correct);recordActivity(w.lang,correct?'quizCorrect':'quizWrong');up(w,c)}function normalize(s){return String(s).toLocaleLowerCase().trim().normalize('NFKC').replace(/[.,!?¡¿]/g,'').replace(/\s+/g,' ')}function checkWritten(w,s){let target=normalize(s);let variants=w.meaning.split(';').map(normalize);return variants.some(x=>x===target)}function renderQuiz(){let el=$('#quiz');if(!quiz){el.innerHTML=`<h2>Quizzes</h2><div class="panel"><label>Idioma<select id="quizLang"><option value="all">Ambos</option><option value="ja">Japonés</option><option value="de">Alemán</option></select></label><br><br><label>Tipo<select id="quizMode"><option value="mixed">Mixto: opción múltiple y escrito</option><option value="multiple">Opción múltiple</option><option value="written">Respuesta escrita</option></select></label><label>Vocabulario<select id="quizScope"><option value="mixed">Acumulativo: hoy + anteriores (recomendado)</option><option value="today">Solo las palabras de hoy</option><option value="all">Todo el historial aprendido</option><option value="difficult">Palabras difíciles</option></select></label><p class="hint">El quiz usa únicamente palabras que ya viste en Aprender. El modo acumulativo combina las de hoy con las de días anteriores; nunca introduce vocabulario nuevo. Los resultados no adelantan los repasos.</p><button data-action="start-quiz">Empezar quiz</button></div>`;return}let w=quiz.items[quiz.i];if(!w){el.innerHTML=`<div class="panel center"><h2>¡Quiz terminado!</h2><p class="stats">${quiz.score}/${quiz.items.length}</p><button data-action="end-quiz">Volver</button></div>`;return}let type=quiz.mode==='mixed'?(quiz.i%2?'written':'multiple'):quiz.mode;if(!quiz.options)quiz.options=optionsFor(w);let body=type==='multiple'?`<div class="answers">${quiz.options.map(x=>`<button data-option="${esc(x.id)}" ${quiz.checked?'disabled':''} class="${quiz.checked?(x.id===w.id?'correct':x.id===quiz.response?'wrong':''):''}">${esc(x.meaning)}</button>`).join('')}</div>`:`<div class="spaced"><input type="text" id="quizInput" autocomplete="off" placeholder="Significado en español" ${quiz.checked?'disabled':''} value="${esc(quiz.response)}"><p class="hint">Escribe uno de los significados principales. Se ignoran mayúsculas y puntuación.</p>${quiz.checked?'':'<button data-action="check-written">Comprobar</button>'}</div>`;el.innerHTML=`<div class="row between"><h2>Quiz de vocabulario</h2><span class="pill">${quiz.i+1}/${quiz.items.length}</span></div><div class="panel"><small>${label(w.lang)} · ${type==='multiple'?'Opción múltiple':'Respuesta escrita'}</small><div class="word">${jp(w)}</div><p>¿Qué significa?</p>${body}${quiz.checked?`<div class="panel" style="background:#f8f5fc"><b>${quiz.isCorrect?'✓ Correcto':'Respuesta de referencia'}</b>${answer(w)}</div><button data-action="next-quiz">Siguiente</button>`:''}</div><button class="secondary" data-action="end-quiz">Salir</button>`}
let contextLang='de',contextScope='previous',contextReveal=false;
function contextPool(){const lang=contextLang,history=Object.entries(state.dailySets||{}).filter(([k])=>k.endsWith(':'+lang)&&k.slice(0,10)<dayOffset()).sort((a,b)=>b[0].localeCompare(a[0]));let ids=[];if(contextScope==='today')ids=dailyIds(lang);else if(contextScope==='all')ids=history.flatMap(([,a])=>a).concat(dailyIds(lang));else ids=history[0]?.[1]||[];const seen=new Set();return ids.map(id=>words.find(w=>w.id===id)).filter(w=>{if(!w||seen.has(w.id)||card(w).status==='new')return false;seen.add(w.id);return true})}
function renderContext(){const el=$('#context'),pool=contextPool();const maxSentences=pool.length<8?2:pool.length<20?3:4;const chunks=[];for(let i=0;i<pool.length;i+=maxSentences)chunks.push(pool.slice(i,i+maxSentences));const paragraphs=chunks.map((group,i)=>`<div class="panel"><small>Texto ${i+1} · ${group.length} ${group.length===1?'palabra':'palabras'} estudiadas</small><p class="contextText">${group.map(w=>esc(w.lang==='ja'?(w.contextJa||w.example||w.word):(w.example||w.word))).join(' ')}</p>${contextReveal?`<p>${group.map(w=>esc(w.exampleEs||w.meaning)).join(' ')}</p><p class="hint">Vocabulario: ${group.map(w=>jp(w)).join(' · ')}</p>`:''}</div>`).join('');el.innerHTML=`<h2>Palabras en contexto</h2><div class="panel"><p>Lee las oraciones e intenta comprenderlas antes de revelar su significado. Los textos reutilizan ejemplos del vocabulario que ya aprendiste. En japonés se muestra kanji con lectura en hiragana y se priorizan frases breves y corteses (です・ます). No se generan frases nuevas con IA.</p><div class="grid"><label>Idioma<select id="contextLang"><option value="de" ${contextLang==='de'?'selected':''}>Alemán</option><option value="ja" ${contextLang==='ja'?'selected':''}>Japonés</option></select></label><label>Palabras<select id="contextScope"><option value="previous" ${contextScope==='previous'?'selected':''}>Último día anterior</option><option value="today" ${contextScope==='today'?'selected':''}>Hoy</option><option value="all" ${contextScope==='all'?'selected':''}>Todas las estudiadas</option></select></label></div><p class="hint">Conforme acumules palabras, los bloques incluirán más oraciones. Se respetan las cinco palabras asignadas por día.</p><button data-action="toggle-context" class="secondary">${contextReveal?'Ocultar traducciones':'Mostrar traducciones'}</button></div>${pool.length?paragraphs:'<div class="panel"><p>Todavía no hay palabras estudiadas para este período. Si hoy es tu primer día, elige «Hoy»; mañana podrás practicar las de hoy aquí.</p function renderBrowse(){let el=$('#browse');let lang=el.dataset.lang||'ja',category=el.dataset.cat||'all',q=el.dataset.q||'';let cats=[...new Set(words.filter(w=>w.lang===lang).map(w=>w.category))];let a=words.filter(w=>w.lang===lang&&(category==='all'||w.category===category)&&(`${w.word} ${w.reading} ${w.meaning}`.toLowerCase().includes(q.toLowerCase())));el.innerHTML=`<h2>Vocabulario</h2><div class="panel"><div class="grid"><label>Idioma<select id="browseLang"><option value="ja" ${lang==='ja'?'selected':''}>Japonés</option><option value="de" ${lang==='de'?'selected':''}>Alemán</option></select></label><label>Categoría<select id="browseCat"><option value="all">Todas</option>${cats.map(c=>`<option value="${esc(c)}" ${category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label></div><div class="spaced"><input id="browseSearch" type="text" placeholder="Buscar palabra o traducción" value="${esc(q)}"></div><p class="hint">${a.length} entradas</p></div><div id="browseList">${a.slice(0,200).map(w=>`<div class="panel"><b>${jp(w)}</b> <span class="pill">${esc(w.category)}</span><p>${esc(w.meaning)}</p><small>${esc(w.example)} — ${esc(w.exampleEs)}</small></div>`).join('')}</div>`}
function renderSettings(){let learned=Object.values(state.cards).filter(c=>c.status!=='new').length;$('#settings').innerHTML=`<h2>Ajustes y respaldo</h2><div class="panel"><h2>☁️ Sincronización entre dispositivos</h2><div id="syncStatus">Cargando conexión...</div><div class="row"><input type="email" id="syncEmail" placeholder="Tu correo electrónico" autocomplete="email"><input type="password" id="syncPassword" placeholder="Contraseña de Dos Palabras (mínimo 6 caracteres)" autocomplete="new-password"><button data-action="sync-signup">Crear cuenta</button><button data-action="sync-login">Iniciar sesión</button><button class="secondary" data-action="sync-logout">Cerrar sesión</button></div><p class="hint">Usa el mismo correo y contraseña en ambos dispositivos. Si Supabase solicita confirmar el correo, revisa tu bandeja de entrada. Haz un respaldo antes de sincronizar por primera vez.</p><div class="row"><button data-action="sync-upload">Subir progreso de este dispositivo</button><button class="secondary" data-action="sync-download">Descargar progreso de la nube</button></div><p class="hint">La primera sincronización es manual para evitar sobrescribir tu progreso. Después se sincronizan automáticamente los cambios. No trabajes simultáneamente sin conexión en ambos dispositivos: gana el último guardado.</p></div><div class="panel"><label>Máximo de palabras nuevas por día, por idioma <input id="daily" type="number" min="1" max="30" value="${state.settings.daily}"></label><p class="hint">Las tarjetas vencidas no cuentan contra este límite.</p><button data-action="save-settings">Guardar ajustes</button></div><div class="panel"><h2>Tu progreso</h2><p><b>${learned}</b> entradas iniciadas</p><div class="row"><button data-action="export">Exportar copia JSON</button><label class="pill" style="cursor:pointer">Importar copia <input type="file" id="importFile" accept="application/json,.json" style="display:none"></label></div><p class="hint">La importación sustituye el progreso actual. Conserva tu copia en un lugar seguro.</p></div><div class="panel"><h2>Agregar vocabulario</h2><p>Importa un archivo JSON de entradas adicionales. Las palabras con un ID ya existente se omiten; las nuevas se guardan en este navegador.</p><label class="pill" style="cursor:pointer">Importar vocabulario JSON <input type="file" id="vocabFile" accept="application/json,.json" style="display:none"></label><p class="hint">Para distribuir nuevas palabras en GitHub, también podrás añadirlas a los archivos ja.json y de.json.</p></div>`}
let progressLang='ja';
function renderProgress(){
 const lang=progressLang, list=words.filter(w=>w.lang===lang), learned=list.filter(w=>card(w).status!=='new'),
 mastered=learned.filter(w=>card(w).status==='review'),due=learned.filter(isDue),
 reviewCount=learned.reduce((n,w)=>n+(card(w).correct||0)+(card(w).wrong||0),0),
 quizGood=learned.reduce((n,w)=>n+(card(w).quizCorrect||0),0),quizBad=learned.reduce((n,w)=>n+(card(w).quizWrong||0),0),
 totalQuiz=quizGood+quizBad,accuracy=totalQuiz?Math.round(100*quizGood/totalQuiz):null;
 const activity=state.activity||{},dates=Array.from({length:7},(_,i)=>dayOffset(i-6)),
 dayData=dates.map(d=>({day:d,entry:activity[d+':'+lang]||{},introduced:learned.filter(w=>card(w).introduced===d).length})),
 max=Math.max(5,...dayData.map(d=>d.introduced)),
 activeDays=new Set([...learned.map(w=>card(w).introduced).filter(Boolean),...Object.keys(activity).filter(k=>k.endsWith(':'+lang)).filter(k=>Object.values(activity[k]||{}).some(v=>v>0)).map(k=>k.slice(0,10))]);
 let streak=0;let anchor=dayOffset();if(!activeDays.has(anchor))anchor=dayOffset(-1);
 for(let i=0;i<366;i++){const d=new Date(anchor+'T12:00:00');d.setDate(d.getDate()-i);const key=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');if(activeDays.has(key))streak++;else break}
 const metric=(number,name,info='')=>`<div class="panel" style="margin:0"><div class="stats">${number}</div><b>${name}</b>${info?`<p class="hint">${info}</p>`:''}</div>`;
 const bars=dayData.map(d=>`<div style="flex:1;min-width:0;text-align:center"><div style="height:100px;display:flex;align-items:flex-end;justify-content:center"><div title="${d.day}: ${d.introduced} palabras" style="height:${Math.max(3,Math.round(d.introduced/max*100))}%;width:65%;max-width:40px;background:#7c6ab0;border-radius:7px 7px 0 0"></div></div><small>${d.day.slice(5)}</small><div class="hint">${d.introduced}</div></div>`).join('');
 $('#progress').innerHTML=`<h2>Mi progreso</h2><div class="panel"><div class="row"><button data-action="progress-lang" data-lang="ja" class="${lang==='ja'?'active':'secondary'}">🇯🇵 Japonés</button><button data-action="progress-lang" data-lang="de" class="${lang==='de'?'active':'secondary'}">🇩🇪 Alemán</button></div><p class="hint">Estadísticas basadas en tus datos guardados y sincronizados.</p></div><div class="grid">${metric(learned.length,'Palabras iniciadas',`${list.length} disponibles`)}${metric(mastered.length,'En repaso espaciado','No significa dominio definitivo')}${metric(reviewCount,'Respuestas en tarjetas','Correctas e incorrectas acumuladas')}${metric(totalQuiz?accuracy+' %':'—','Aciertos en quizzes',`${quizGood} correctas de ${totalQuiz} respuestas`)}${metric(due.length,'Repasos pendientes')}${metric(streak,'Días de racha','Incluye hoy o ayer si estudiaste')}</div><div class="panel"><h2>Palabras iniciadas · últimos 7 días</h2><div style="display:flex;align-items:flex-end;gap:8px">${bars}</div><p class="hint">Se usa la fecha de introducción guardada en cada tarjeta. Las fechas anteriores que no se registraron no pueden reconstruirse.</p></div><div class="panel"><h2>Actividad registrada</h2><p>Quizzes: <b>${quizGood}</b> aciertos y <b>${quizBad}</b> errores.</p><p>Respuestas en tarjetas: <b>${reviewCount}</b>.</p><p class="hint">El historial de repasos por fecha comienza en la versión 2.5; las cifras acumuladas sí aprovechan el progreso anterior.</p></div>`;
}

document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let action=b.dataset.action;if(b.dataset.rate&&session){rate(session.items[session.i],b.dataset.rate);nextCard();return}if(b.dataset.option&&quiz&&!quiz.checked){quiz.response=b.dataset.option;quiz.isCorrect=quiz.response===quiz.items[quiz.i].id;quiz.score+=Number(quiz.isCorrect);logQuiz(quiz.items[quiz.i],quiz.isCorrect);quiz.checked=true;renderQuiz();return}if(action==='progress-lang'){progressLang=b.dataset.lang;renderProgress()}if(action==='sync-signup')syncSignUp();if(action==='sync-login')syncLogIn();if(action==='sync-logout')syncLogOut();if(action==='sync-upload')syncUpload(true);if(action==='sync-download')syncDownload(true);if(action==='study')startLearn(b.dataset.lang);if(action==='quiz')page('quiz');if(action==='toggle-context'){contextReveal=!contextReveal;renderContext()}if(action==='start-study')startStudy($('#studyLang').value,false);if(action==='start-learn')startLearn($('#studyLang').value);if(action==='start-today'){let lang=$('#studyLang').value;let today=todays(lang).filter(w=>card(w).status!=='new');let ids=new Set(today.map(w=>w.id));let due=choose(lang).filter(w=>!ids.has(w.id));session={items:[...today,...due],i:0,done:0,reveal:false,free:false};page('study')}if(action==='start-free')startStudy($('#studyLang').value,true);if(action==='learn-word'&&session){let w=session.items[session.i];introduce(w);nextCard()}if(action==='reveal'){session.reveal=true;renderStudy()}if(action==='next-card')nextCard();if(action==='end-study'){session=null;page('home')}if(action==='start-quiz')startQuiz();if(action==='check-written'&&quiz){quiz.response=$('#quizInput').value;quiz.isCorrect=checkWritten(quiz.items[quiz.i],quiz.response);quiz.score+=Number(quiz.isCorrect);logQuiz(quiz.items[quiz.i],quiz.isCorrect);quiz.checked=true;renderQuiz()}if(action==='next-quiz'){quiz.i++;quiz.checked=false;quiz.response='';quiz.options=null;renderQuiz()}if(action==='end-quiz'){quiz=null;page document.addEventListener('change',async e=>{let t=e.target;if(t.id==='contextLang'){contextLang=t.value;contextReveal=false;renderContext()}if(t.id==='contextScope'){contextScope=t.value;contextReveal=false;renderContext()}if(t.id==='browseLang'){$('#browse').dataset.lang=t.value;$('#browse').dataset.cat='all';renderBrowse()}if(t.id==='browseCat'){$('#browse').dataset.cat=t.value;renderBrowse()}if(t.id==='importFile'&&t.files[0]){try{let x=JSON.parse(await t.files[0].text());if(x.version!==2||!x.state?.cards)throw Error('Formato de respaldo no compatible');if(!confirm('¿Sustituir el progreso actual por esta copia?'))return;state=x.state;if(Array.isArray(x.customWords))localStorage.setItem('dp-custom-words',JSON.stringify(x.customWords));save();location.reload()}catch(err){notice('No se pudo importar: '+err.message)}}if(t.id==='vocabFile'&&t.files[0]){try{let x=JSON.parse(await t.files[0].text());if(!Array.isArray(x)||!x.every(w=>w.id&&w.lang&&w.word&&w.meaning))throw Error('Formato inválido');let saved=JSON.parse(localStorage.getItem('dp-custom-words')||'[]'),ids=new Set([...words,...saved].map(w=>w.id)),added=x.filter(w=>!ids.has(w.id)&&['ja','de'].includes(w.lang));saved.push(...added);localStorage.setItem('dp-custom-words',JSON.stringify(saved));words.push(...added);scheduleCloudSave();notice(`${added.length} entradas añadidas`);renderSettings()}catch(err){notice('Error: '+err.message)}}});document.addEventListener('input',e=>{if(e.target.id==='browseSearch'){let el=$('#browse');el.dataset.q=e.target.value;let q=e.target.value.toLowerCase(),lang=el.dataset.lang||'ja',cat=el.dataset.cat||'all';let a=words.filter(w=>w.lang===lang&&(cat==='all'||w.category===cat)&&(`${w.word} ${w.reading} ${w.meaning}`.toLowerCase().includes(q)));$('#browseList').innerHTML=a.slice(0,200).map(w=>`<div class="panel"><b>${jp(w)}</b><p>${esc(w.meaning)}</p><small>${esc(w.example)} — ${esc(w.exampleEs)}</small></div>`).join('')}});

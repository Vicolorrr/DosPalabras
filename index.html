'use strict';const KEY='dospalabras-v2-progress';const TODAY=()=>new Date().toLocaleDateString('en-CA');const now=()=>Date.now();const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const shuffle=a=>[...a].sort(()=>Math.random()-.5);let words=[],state={cards:{},settings:{daily:5},date:null},session=null,quiz=null,shownPage='home';

function todays(lang){return ['ja','de'].filter(l=>lang==='all'||lang===l).flatMap(l=>dailyIds(l)).map(id=>words.find(w=>w.id===id)).filter(Boolean)}

function introduce(w){let c={...card(w)};if(c.status==='new'){c.status='learning';c.introduced=TODAY();c.due=now();c.step=0;recordActivity(w.lang,'introduced');up(w,c)}}function rate(w,r){let c={...card(w)},t=now(),day=86400000;if(c.status==='new'){c.status='learning';c.introduced=TODAY();c.step=0;recordActivity(w.lang,'introduced')}recordActivity(w.lang,'reviews');if(r==='again'){c.wrong++;c.lapses++;c.status='learning';c.step=0;c.due=t+10*60000;c.interval=0;c.ease=Math.max(1.3,c.ease-.2)}else if(c.status==='learning'){c.correct++;if(r==='hard'){c.due=t+10*60000}else if(r==='good'){c.step++;if(c.step>=2){c.status='review';c.interval=1;c.due=t+day;c.reps++}else c.due=t+day}else{c.status='review';c.interval=3;c.due=t+3*day;c.reps++;c.ease=Math.min(3,c.ease+.1)}}else{c.correct++;c.reps++;if(r==='hard'){c.interval=Math.max(1,Math.round(c.interval*1.2));c.ease=Math.max(1.3,c.ease-.15)}if(r==='good')c.interval=Math.max(1,Math.round(c.interval*c.ease));if(r==='easy'){c.interval=Math.max(2,Math.round(c.interval*c.ease*1.3));c.ease=Math.min(3,c.ease+.1)}c.due=t+c.interval*day}c.last=t;up(w,c)}

function renderHome(){

 const {data,error}=await sb.from('user_progress').upsert({user_id:syncUser.id,data:syncPayload(),updated_at:new Date().toISOString()},{onConflict:'user_id'}).select('updated_at').single();if(error)throw error;
 syncStamp=data.updated_at;localStorage.setItem('dp-cloud-stamp',syncStamp);syncReady=true;syncMessage('✓ Progreso sincronizado con la nube.');if(manual)notice('Progreso y vocabulario subidos a la nube');
 }catch(e){syncMessage('No se pudo subir: '+e.message)}finally{syncBusy=false}}
async function syncDownload(manual){if(!sb||!syncUser){if(manual)notice('Inicia sesión primero');return}if(syncBusy)return;clearTimeout(syncTimer);syncBusy=true;
 try{const {data:row,error}=await sb.from('user_progress').select('data,updated_at').eq('user_id',syncUser.id).maybeSingle();if(error)throw error;if(!row?.data?.state?.cards){notice('Todavía no hay un respaldo en la nube');return}
 if(manual&&!confirm('Esto sustituirá el progreso y vocabulario local por la copia de la nube. ¿Continuar?'))return;
 syncReady=false;state=row.data.state;localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem('dp-custom-words',JSON.stringify(row.data.customWords||[]));syncStamp=row.updated_at;localStorage.setItem('dp-cloud-stamp',syncStamp);syncReady=true;location.reload();
 }catch(e){syncMessage('No se pudo descargar: '+e.message)}finally{syncBusy=false}}
const NOTIFICATION_KEY='dp-notification-token';
function notificationStatus(message){const el=document.getElementById('notificationStatus');if(el)el.textContent=message}
async function sha256Hex(value){const bytes=new TextEncoder().encode(value),digest=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function notificationCreate(){
 if(!sb||!syncUser){notice('Primero inicia sesión en Supabase');return}
 if(!crypto?.subtle){notice('Se necesita HTTPS o localhost');return}
 if(!confirm('¿Crear una clave nueva? Se desactivará cualquier clave anterior de notificaciones.'))return;
 const token=Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>b.toString(16).padStart(2,'0')).join('');
 try{const hash=await sha256Hex(token);const {error}=await sb.from('notification_tokens').upsert({user_id:syncUser.id,token_hash:hash},{onConflict:'user_id'});if(error)throw error;localStorage.setItem(NOTIFICATION_KEY,token);notificationStatus('✓ Clave creada. Pulsa «Copiar clave» y pégala en el Atajo del iPhone. No la compartas.');notice('Clave de notificaciones creada')}
 catch(e){notificationStatus('Error: '+e.message)}
}
async function notificationCopy(){const token=localStorage.getItem(NOTIFICATION_KEY);if(!token){notice('Genera una clave en este dispositivo primero');return}try{await navigator.clipboard.writeText(token);notice('Clave copiada. Guárdala solo en tu Atajo.')}catch(e){notificationStatus('No se pudo copiar. Prueba desde HTTPS: '+e.message)}}
async function notificationRevoke(){if(!sb||!syncUser){notice('Inicia sesión primero');return}if(!confirm('¿Desactivar las notificaciones y revocar la clave actual?'))return;try{const {error}=await sb.from('notification_tokens').delete().eq('user_id',syncUser.id);if(error)throw error;localStorage.removeItem(NOTIFICATION_KEY);notificationStatus('Clave revocada. Los Atajos dejarán de recibir palabras.')}catch(e){notificationStatus('Error: '+e.message)}}
window.addEventListener('focus',async()=>{if(!syncReady||!syncUser||syncBusy||syncTimer)return;try{const {data,error}=await sb.from('user_progress').select('updated_at').eq('user_id',syncUser.id).maybeSingle();if(!error&&data?.updated_at&&data.updated_at!==syncStamp){syncReady=false;syncMessage('Hay cambios en otro dispositivo. Pulsa «Descargar progreso de la nube» para recuperarlos.')}}catch(e){}});

async function init(){load();try{let r=await Promise.all(['ja.json','de.json'].map(x=>fetch(x)));if(r.some(x=>!x.ok))throw Error('No se pudieron leer los archivos');words=(await Promise.all(r.map(x=>x.json()))).flat();let extra=JSON.parse(localStorage.getItem('dp-custom-words')||'[]');let ids=new Set(words.map(w=>w.id));words.push(...extra.filter(w=>!ids.has(w.id)));render();await syncInit()}catch(e){$('#home').innerHTML='<div class="panel"><h2>Hay que abrir la aplicación desde un servidor local</h2><p>Los navegadores suelen bloquear la lectura de archivos JSON cuando abres index.html directamente desde Archivos. Usa el servidor local indicado en INSTRUCCIONES.md o publica los archivos en GitHub Pages.</p><small>'+esc(e.message)+'</small></div>'}}init();
</script></body></html>
